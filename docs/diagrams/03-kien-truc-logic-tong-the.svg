t="700">BACKEND NESTJS</tspan><tspan x="960" dy="42">Middleware bảo mật → Guard → ValidationPipe + DTO → Controller → Service</tspan><tspan x="960" dy="42">Interceptor / Filter chuẩn hóa phản hồi và lỗi; Scheduler xử lý nhắc việc</tspan></text><line x1="960" y1="690" x2="960" y2="775" stroke="#C75B12" stroke-width="4" marker-end="url(#arrowOrange)"/><rect x="245" y="790" width="650" height="205" rx="22" fill="#F2EDFF" stroke="#6F42C1" stroke-width="3" filter="url(#shadow)"/><text x="570" y="842" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#172033"><tspan x="570" dy="0" font-weight="700">PRISMA + MYSQL 8</tspan><tspan x="570" dy="34">Mô hình quan hệ • migration • transaction</tspan><tspan x="570" dy="34">unique • index • cascade</tspan><tspan x="570" dy="34">Dữ liệu bền vững và ràng buộc toàn vẹn</tspan></text><rect x="1025" y="790" width="650" height="205" rx="22" fill="#FFF6D9" stroke="#B87900" stroke-width="3" filter="url(#shadow)"/><text x="1350" y="835" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#172033"><tspan x="1350" dy="0" font-weight="700">DỊCH VỤ TÍCH HỢP</tspan><tspan x="1350" dy="34">AI provider • Google / Facebook OAuth</tspan><tspan x="1350" dy="34">Stripe • SePay • Redis</tspan><tspan x="1350" dy="34">Chỉ hoạt động khi cấu hình; secret ở phía server</tspan></text><line x1="895" y1="892" x2="1025" y2="892" stroke="#B87900" stroke-width="4" marker-end="url(#arrow)"/></svg>