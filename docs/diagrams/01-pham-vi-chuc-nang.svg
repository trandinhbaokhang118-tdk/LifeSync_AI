<rect width="1920" height="1080" fill="#F8FAFC"/>
<text x="960" y="76" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#173F6B">PHẠM VI CHỨC NĂNG VÀ PHÂN QUYỀN</text>
<line x1="620" y1="96" x2="1300" y2="96" stroke="#C9D7E6" stroke-width="2"/>
<rect x="55" y="190" width="280" height="235" rx="22" fill="#EAF4FF" stroke="#173F6B" stroke-width="3" filter="url(#shadow)"/><text x="195" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#172033"><tspan x="195" dy="0" font-weight="700">NGƯỜI DÙNG</tspan><tspan x="195" dy="42">Tài khoản cá nhân</tspan><tspan x="195" dy="42">Dữ liệu theo userId</tspan></text><rect x="400" y="235" width="285" height="145" rx="22" fill="#FFFFFF" stroke="#64748B" stroke-width="3" filter="url(#shadow)"/><text x="542" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" fill="#172033"><tspan x="542" dy="0" font-weight="700">NHÓM CÁ NHÂN</tspan><tspan x="542" dy="42">Xác thực và ownership</tspan></text><line x1="335" y1="307" x2="400" y2="307" stroke="#173F6B" stroke-width="4" marker-end="url(#arrowBlue)"/><rect x="760" y="145" width="1090" height="96" rx="18" fill="#EAF4FF" stroke="#173F6B" stroke-width="3"/><text x="1305" y="179" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#172033"><tspan x="1305" dy="0" font-weight="700">TÀI KHOẢN VÀ HỒ SƠ</tspan><tspan x="1305" dy="31">Đăng ký, đăng nhập, làm mới phiên, khôi phục, OAuth / OTP / MFA</tspan></text><polyline points="685,307 720,307 720,193 760,193" fill="none" stroke="#667F99" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="760" y="270" width="1090" height="96" rx="18" fill="#EAF4FF" stroke="#173F6B" stroke-width="3"/><text x="1305" y="304" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#172033"><tspan x="1305" dy="0" font-weight="700">NĂNG SUẤT</tspan><tspan x="1305" dy="31">Task, Tag, TimeBlock, Reminder, Notification, Dashboard và Focus</tspan></text><polyline points="685,307 720,307 720,318 760,318" fill="none" stroke="#667F99" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="760" y="395" width="1090" height="96" rx="18" fill="#EAF4FF" stroke="#173F6B" stroke-width="3"/><text x="1305" y="429" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#172033"><tspan x="1305" dy="0" font-weight="700">TRỢ LÝ AI</tspan><tspan x="1305" dy="31">Hội thoại, lịch sử, gợi ý và tạo hành động theo cấu hình</tspan></text><polyline points="685,307 720,307 720,443 760,443" fill="none" stroke="#667F99" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="760" y="520" width="1090" height="96" rx="18" fill="#EAF4FF" stroke="#173F6B" stroke-width="3"/><text x="1305" y="554" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#172033"><tspan x="1305" dy="0" font-weight="700">SỨC KHỎE VÀ GPS</tspan><tspan x="1305" dy="31">Hồ sơ thể chất, bài tập, hoạt động, lộ trình và quyền thiết bị</tspan></text><polyline points="685,307 720,307 720,568 760,568" fill="none" stroke="#667F99" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="760" y="645" width="1090" height="96" rx="18" fill="#EAF4FF" stroke="#173F6B" stroke-width="3"/><text x="1305" y="679" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#172033"><tspan x="1305" dy="0" font-weight="700">THUÊ BAO VÀ THANH TOÁN</tspan><tspan x="1305" dy="31">Gói FREE / PRO / PLUS, Stripe, SePay và trạng thái đơn hàng</tspan></text><polyline points="685,307 720,307 720,693 760,693" fill="none" stroke="#667F99" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="760" y="770" width="1090" height="96" rx="18" fill="#EAF4FF" stroke="#173F6B" stroke-width="3"/><text x="1305" y="804" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#172033"><tspan x="1305" dy="0" font-weight="700">THIẾT LẬP CÁ NHÂN</tspan><tspan x="1305" dy="31">Ngôn ngữ, thông báo, bảo mật và trải nghiệm đa nền tảng</tspan></text><polyline points="685,307 720,307 720,818 760,818" fill="none" stroke="#667F99" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="55" y="690" width="280" height="225" rx="22" fill="#FFF1E8" stroke="#C75B12" stroke-width="3" filter="url(#shadow)"/><text x="195" y="755" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#172033"><tspan x="195" dy="0" font-weight="700">QUẢN TRỊ VIÊN</tspan><tspan x="195" dy="42">Vai trò ADMIN</tspan><tspan x="195" dy="42">Khu vực /admin</tspan></text><rect x="400" y="735" width="285" height="145" rx="22" fill="#FFFFFF" stroke="#C75B12" stroke-width="3" filter="url(#shadow)"/><text x="542" y="785" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" fill="#172033"><tspan x="542" dy="0" font-weight="700">NHÓM QUẢN TRỊ</tspan><tspan x="542" dy="42">RBAC và xác nhận</tspan></text><line x1="335" y1="802" x2="400" y2="802" stroke="#C75B12" stroke-width="4" marker-end="url(#arrowOrange)"/><rect x="760" y="930" width="310" height="105" rx="18" fill="#FFF6D9" stroke="#B87900" stroke-width="3"/><text x="915.0" y="969" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#172033"><tspan x="915.0" dy="0" font-weight="700">NGƯỜI DÙNG</tspan><tspan x="915.0" dy="30">Danh sách, cập nhật, vai trò, xóa</tspan></text><rect x="1120" y="930" width="310" height="105" rx="18" fill="#FFF6D9" stroke="#B87900" stroke-width="3"/><text x="1275.0" y="969" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#172033"><tspan x="1275.0" dy="0" font-weight="700">VẬN HÀNH</tspan><tspan x="1275.0" dy="30">Thống kê, hoạt động và sao lưu</tspan></text><rect x="1480" y="930" width="310" height="105" rx="18" fill="#FFF6D9" stroke="#B87900" stroke-width="3"/><text x="1635.0" y="969" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#172033"><tspan x="1635.0" dy="0" font-weight="700">THUÊ BAO</tspan><tspan x="1635.0" dy="30">Theo dõi và điều chỉnh gói</tspan></text><polyline points="542,880 542,902 715,902 715,982 760,982" fill="none" stroke="#C75B12" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrowOrange)"/><polyline points="542,880 542,902 1090,902 1090,982 1120,982" fill="none" stroke="#C75B12" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrowOrange)"/><polyline points="542,880 542,902 1450,902 1450,982 1480,982" fill="none" stroke="#C75B12" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrowOrange)"/></svg>